name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cartevy
          POSTGRES_PASSWORD: cartevy
          POSTGRES_DB: cartevy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cartevy -d cartevy_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://cartevy:cartevy@127.0.0.1:5432/cartevy_ci"
      DIRECT_URL: "postgresql://cartevy:cartevy@127.0.0.1:5432/cartevy_ci"
      DATABASE_SSL_MODE: "disable"
      CARTEVY_ALLOW_LEGACY_MIGRATION_BOOTSTRAP: "1"
      CARTEVY_ALLOW_AUTH_INTEGRATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@11.17.0

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Bootstrap legacy migration history
        run: npm run prisma:bootstrap-legacy

      - name: Apply pending migrations
        run: npm run prisma:migrate:deploy

      - name: Verify database schema
        run: npm run prisma:diff:check

      - name: Run unit tests
        run: npm test

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
