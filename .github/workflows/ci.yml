name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

      # Prisma 7 carrega a datasource durante validate/generate.
      # Estas URLs são apenas sintáticas no CI.
      # Nenhuma conexão com banco real é realizada.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/cartevy"
      DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/cartevy"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Use project npm version
        run: npm install --global npm@11.17.0

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate --if-present

      - name: Generate Prisma Client
        run: npm run prisma:generate --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
